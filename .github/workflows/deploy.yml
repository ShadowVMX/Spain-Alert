name: Publicar en GitHub Pages

# GitHub Pages no puede ejecutar nuestro servidor Node, así que este workflow hace
# de "servidor por lotes": descarga los datos de AEMET/EMSC/SAIH con la clave
# guardada como secret, los deja como archivos JSON y publica la web ya construida.
# Así la clave nunca llega al navegador.

on:
  schedule:
    # Cada 10 minutos, que es más o menos el ritmo al que AEMET actualiza las
    # observaciones. GitHub puede retrasar las ejecuciones programadas cuando hay
    # mucha carga: no lo trates como un sistema de tiempo real garantizado.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      encadenado:
        description: "Mantener la cadena de refresco (relanzarse solo cada 10 min)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Si un despliegue está en curso, dejamos que termine y encolamos el siguiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # El eslabón de la cadena espera hasta completar los 10 minutos, así que el job
    # dura eso más lo que tarde en publicar. El tope evita que un job colgado se
    # quede ocupando un runner para siempre.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Se apunta el arranque para poder espaciar el siguiente eslabón exactamente
      # 10 minutos desde AQUÍ, y no 10 minutos desde que termine: si no, cada vuelta
      # se iría retrasando lo que tarde el propio despliegue.
      - name: Marcar el arranque
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm run install:all

      # Si el secret no existe, Actions no avisa: lo pasa vacío y el fallo aparece
      # mucho después, disfrazado de "clave inválida". Este paso lo dice de entrada.
      # Se aceptan varios nombres porque AEMET_KEY es un error de tecleo fácil de
      # cometer, y porque el secret puede haberse guardado como "variable".
      - name: Comprobar que la clave de AEMET está configurada
        env:
          CLAVE: ${{ secrets.AEMET_API_KEY || secrets.AEMET_KEY || vars.AEMET_API_KEY || vars.AEMET_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::No se encuentra la clave de AEMET."
            echo "Guárdala en Settings → Secrets and variables → Actions → New repository secret."
            echo "Se admite el nombre AEMET_API_KEY (recomendado) o AEMET_KEY."
            echo "Ojo: tiene que estar en la pestaña 'Secrets', no en 'Variables',"
            echo "y ser un 'repository secret', no uno de entorno."
            exit 1
          fi
          # Solo la longitud: el valor no se imprime nunca.
          echo "✅ Clave encontrada (${#CLAVE} caracteres)."

      # Solo en push y en ejecuciones a mano. En las programadas NO: si una
      # comprobación fallara, el cron dejaría de publicar datos de lluvia, y quedarse
      # sin avisos es peor que arrastrar un fallo de lógica en una capa secundaria.
      - name: Comprobaciones
        if: github.event_name != 'schedule'
        run: npm --prefix server run test

      - name: Descargar datos de AEMET, EMSC y SAIH
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY || secrets.AEMET_KEY || vars.AEMET_API_KEY || vars.AEMET_KEY }}
        run: npm --prefix server run generar-datos -- "$GITHUB_WORKSPACE/web/public/datos"

      - name: Construir la web
        env:
          VITE_DATA_MODE: estatico
          # En Pages la app vive en /<nombre-del-repo>/, no en la raíz del dominio.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm --prefix web run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # Al final del job, donde se lee sin tener que excavar entre las líneas de
      # las acciones oficiales. Se ejecuta siempre, también si algo ha fallado.
      - name: Estado de las fuentes de datos
        if: always()
        run: cat "$RUNNER_TEMP/diagnostico.txt" 2>/dev/null || echo "(sin diagnóstico)"

      # --- La cadena de refresco ------------------------------------------------
      #
      # GitHub trata las ejecuciones programadas como "cuando pueda": con el cron
      # puesto cada 10 minutos, en un día real solo se lanzaron 6 veces. Para una
      # app que dice "tiempo real" eso no vale, y el aviso de datos viejos acababa
      # encendido casi siempre, que es la forma más rápida de que nadie lo mire.
      #
      # Así que el workflow se relanza a sí mismo. El disparo manual (dispatch) sí
      # se respeta siempre, y el token vive como secret del repositorio: cifrado,
      # invisible incluso para su dueño una vez guardado, y enmascarado en los logs.
      # No hace falta confiárselo a ningún servicio de terceros.
      #
      # Solo encadenan los runs que ya venían encadenados. Si encadenara cualquiera,
      # cada ejecución programada abriría una cadena nueva y se multiplicarían.
      #
      # Y se ejecuta SIEMPRE, aunque el despliegue haya fallado: si la cadena se
      # cortara con cada fallo puntual de AEMET, se moriría el primer día malo.
      - name: Mantener la cadena de refresco
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.encadenado }}
        env:
          TOKEN: ${{ secrets.TOKEN_REFRESCO }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secret TOKEN_REFRESCO. Sin él la cadena se corta aquí."
            echo "Créalo en Settings > Secrets and variables > Actions con un fine-grained"
            echo "token que tenga permiso 'Actions: Read and write' sobre este repositorio."
            exit 1
          fi

          RESTA=$(( 600 - ($(date +%s) - INICIO) ))
          if [ "$RESTA" -gt 0 ]; then
            echo "Esperando ${RESTA}s para completar los 10 minutos desde el arranque."
            sleep "$RESTA"
          fi

          CODIGO=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main","inputs":{"encadenado":"true"}}')

          # 204 es la respuesta buena: aceptado y sin cuerpo.
          if [ "$CODIGO" = "204" ]; then
            echo "Siguiente eslabón lanzado."
          else
            echo "::error::No se pudo lanzar el siguiente eslabón (HTTP $CODIGO). La cadena queda cortada."
            echo "Un 404 suele ser el permiso de Actions mal puesto: GitHub responde 404 en vez de 403."
            echo "Mientras tanto, el cron programado sigue actualizando cada pocas horas."
            exit 1
          fi
