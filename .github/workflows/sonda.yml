name: Sondear fuentes de datos

# El entorno de desarrollo no tiene salida a los portales hidrológicos: el proxy
# devuelve 403 a todo lo que no sea GitHub o npm. Este workflow presta el runner
# como banco de pruebas para averiguar qué devuelve de verdad cada endpoint antes
# de escribir la integración.
#
# Solo se lanza a mano. No descarga nada para la web, no despliega y no toca los
# datos publicados: si falla, la app sigue exactamente igual.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    # La clave de AEMET está guardada como secreto DEL ENTORNO github-pages, no del
    # repositorio: solo la ven los jobs que declaran ese entorno. Sin esta línea la
    # sonda recibía la variable vacía y abortaba antes de preguntar nada.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias del servidor
        run: npm --prefix server ci || npm --prefix server install

      - name: Sondear fuentes hidrológicas
        run: npm --prefix server run sondar-fuentes

      - name: Sondear la API de predicción de AEMET
        env:
          # Mismo juego de nombres que acepta el despliegue: la clave puede estar
          # guardada como AEMET_KEY, y con un solo nombre la sonda llegaba vacía.
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY || secrets.AEMET_KEY || vars.AEMET_API_KEY || vars.AEMET_KEY }}
        run: npm --prefix server run sondar-prediccion
