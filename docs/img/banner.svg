<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Alerta España — Mapa nacional de riesgos naturales en tiempo real">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1b2742"/>
    </linearGradient>
    <radialGradient id="tormenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lluvia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#cielo)"/>

  <!-- Retícula sutil, como un mapa -->
  <g stroke="#64748b" stroke-opacity="0.1" stroke-width="1">
    <path d="M0 60h1200M0 120h1200M0 180h1200M0 240h1200"/>
    <path d="M120 0v300M240 0v300M360 0v300M480 0v300M600 0v300M720 0v300M840 0v300M960 0v300M1080 0v300"/>
  </g>

  <!-- Núcleo de tormenta, a la derecha -->
  <circle cx="940" cy="150" r="150" fill="url(#tormenta)"/>
  <circle cx="940" cy="150" r="52" fill="#ef4444" fill-opacity="0.3"/>
  <circle cx="940" cy="150" r="26" fill="#ef4444" fill-opacity="0.55"/>

  <!-- Cortinas de lluvia -->
  <g stroke="url(#lluvia)" stroke-width="2" stroke-linecap="round">
    <path d="M812 96l-16 44M846 84l-16 44M880 92l-16 44M914 78l-16 44M948 90l-16 44M982 80l-16 44M1016 94l-16 44M1050 86l-16 44"/>
    <path d="M828 168l-16 44M862 158l-16 44M896 170l-16 44M930 156l-16 44M964 168l-16 44M998 158l-16 44M1032 172l-16 44"/>
  </g>

  <!-- Rayo -->
  <path d="M952 112l-34 52h24l-14 44 40-58h-26z" fill="#fcd34d" fill-opacity="0.9"/>

  <!-- Marca -->
  <g transform="translate(72 96)">
    <circle cx="26" cy="26" r="26" fill="#ef4444"/>
    <circle cx="26" cy="26" r="26" fill="none" stroke="#ef4444" stroke-opacity="0.45" stroke-width="2">
      <animate attributeName="r" values="26;52;26" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45;0;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M26 13l13 24H13z" fill="#fff"/>
    <rect x="24.5" y="23" width="3" height="8" rx="1.5" fill="#ef4444"/>
    <circle cx="26" cy="33.5" r="1.6" fill="#ef4444"/>
  </g>

  <text x="150" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="700" fill="#f1f5f9" letter-spacing="-1.5">Alerta España</text>
  <text x="152" y="164" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" fill="#94a3b8">Mapa nacional de riesgos naturales en tiempo real</text>
  <text x="152" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#f97316" font-weight="600">Lluvia · DANA · Riadas · Viento · Terremotos</text>

  <g transform="translate(152 222)" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#cbd5e1">
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="66" y="17.5" text-anchor="middle">Radar animado</text>
    <rect x="142" y="0" width="168" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="226" y="17.5" text-anchor="middle">Aviso por proximidad</text>
    <rect x="320" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155"/>
    <text x="410" y="17.5" text-anchor="middle">Sin rastrear tu ubicación</text>
  </g>
</svg>
